[package]
name = "uflabelprinter"
version = "0.2.0"
description = "Print to cheap thermal label printers without the vendor bloatware"
authors = ["unfuckedapps"]
license = "MIT"
repository = "https://github.com/unfuckedapps/ufLabelPrinter"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "uflabelprinter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nusb = "0.2"
tauri-plugin-dialog = "2"
thiserror = "2"
serialport = { version = "4", default-features = false }
lzokay = "2"
btleplug = "0.13"
uuid = "1"
futures = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Foundation"] }
